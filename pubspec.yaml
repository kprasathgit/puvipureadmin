  flutter_local_notifications: ^19.4.1
  flutter_secure_storage: ^9.2.4

  # UI Widgets
  pinput: ^5.0.2
  fl_chart:
   git:
    url: https://github.com/kprasathgit/fl_chart.git
    ref: compat-vector-math-2.1.4
  vector_math: ^2.1.4


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
