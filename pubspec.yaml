publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # UI & State
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  go_router: ^16.2.1

  # HTTP & Utilities
  http: ^1.5.0
  intl: ^0.20.2

  # Firebase
  firebase_core: ^4.1.0
  firebase_messaging: ^16.0.1
  cloud_firestore: ^6.0.1
